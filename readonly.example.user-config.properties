# Bit Heroes bot - settings profile for the account 'YourAccountName'
# File name: readonly.YourAccountName.user-config.properties (in the main folder, next to user-config.properties).
#
# How settings are applied (later wins):
#   1. built-in defaults
#   2. ig.user.*   - this file, BOTH heroes of the account
#   3. ig.left.*   / ig.right.*  - this file, only while that hero is playing (only the keys you write; a key you leave out
#                    uses the ig.user value). The bot reads which hero is active on the YOUR HEROES page once after login.
#   4. the override windows of the controller (overrides.json) - shared, then per hero.
# A line starting with # is ignored. An empty value means 'not set'. Changes are read when the bot starts.
#
# <event>.enabled=false switches an event off (quest, pvp, world-boss, raid, gvg, invasion, expedition, trials, gauntlet),
# e.g. for a hero that has not unlocked it yet:  ig.right.expedition.enabled=false

# ---------------- both heroes ----------------
# Quest difficulty: 1 = Normal, 2 = Hard, 3 = Heroic
ig.user.quest.mode=3
# Quest zone number; 0 = automatic (the most recent beaten level)
ig.user.quest.zone=0
# Dungeon in that zone, counted left to right; 0 = automatic
ig.user.quest.dungeon=0
# PVP opponent: 1 = top Fight button ... 5; 0 = default
ig.user.pvp.target=0
ig.user.gvg.target=0
# Raid number (1 = first raid); 0 = leave the game's choice
ig.user.raid.level=0
# Raid difficulty: 1 = Normal, 2 = Hard, 3 = Heroic
ig.user.raid.mode=3
# orlag | netherworld | melvin | exterminytion | brimstone | titans | ignited | goodall | gallus ; empty = no World Boss
ig.user.world-boss.name=
# World Boss tier; 0 = leave as the game has it
ig.user.world-boss.tier=0
# World Boss difficulty: 1 = Normal, 2 = Hard, 3 = Heroic
ig.user.world-boss.mode=3
# true = solo (private); false = let other players join and wait for them
ig.user.world-boss.private=true
# Other players to wait for when not private
ig.user.world-boss.players=1
# Minutes to wait for them, then go solo
ig.user.world-boss.wait=15
# Trials tier (13-15 known); 0 = leave the difficulty as the game has it
ig.user.trials.tier=0
# set = Set + Mythic (light blue) | legendary = Legendary (yellow)
ig.user.trials.drops=set
# highest | lowest number inside that tier
ig.user.trials.pick=highest
# Gauntlet tier (1-21); 0 = leave the difficulty as the game has it
ig.user.gauntlet.tier=0
# set | legendary
ig.user.gauntlet.drops=set
# highest | lowest number inside that tier
ig.user.gauntlet.pick=highest
# Invasion wave to play; 0 = the top wave in the list
ig.user.invasion.wave=0
# googarum | twimbo | svord | x5 ; empty = any portal found (also used if the chosen one is not unlocked)
ig.user.expedition.portal=
# Expedition difficulty number (any length, e.g. 7445 or 125000); 0 = leave as the game has it
ig.user.expedition.difficulty=0

